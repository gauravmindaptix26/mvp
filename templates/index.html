<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Influencer Finder AI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f6f9;
}

.hero{
padding:60px;
text-align:center;
}

.card-box{
max-width:900px;
margin:auto;
}

.result-box{
min-height:250px;
background:white;
padding:20px;
border-radius:15px;
white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="container">

<div class="hero">

<h1 class="fw-bold">
Influencer Discovery AI
</h1>

<p class="text-muted">
Search creators using natural language
</p>

</div>

<div class="card shadow-lg border-0 p-4 card-box">

<label class="fw-semibold mb-2">

Search Query

</label>

<textarea
id="query"
class="form-control"
rows="4"
placeholder="Find finance influencers under ₹20,000 budget in Chandigarh"
></textarea>

<button
class="btn btn-primary mt-3"
onclick="searchCreator()"
>
Search Influencers
</button>

</div>

<div class="card shadow-lg border-0 mt-4 p-4 card-box">

<h5>Results</h5>

<div id="summary" class="result-box mb-3" style="display:none"></div>

<div id="table-wrap" style="display:none;overflow-x:auto">
<table class="table table-bordered table-hover align-middle" id="result-table">
  <thead class="table-dark">
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Category</th>
      <th>Followers</th>
      <th>Location</th>
      <th>Reel + Story Reshare (₹)</th>
      <th>Story (₹)</th>
      <th>Static Post (₹)</th>
      <th>UGC No Ads (₹)</th>
      <th>UGC 1 Month (₹)</th>
      <th>Digital Rights 1M (₹)</th>
      <th>Profile</th>
    </tr>
  </thead>
  <tbody id="result-body"></tbody>
</table>
</div>

<div id="no-result" class="result-box">No results yet</div>

</div>

</div>

<script>

async function searchCreator(){
  const query = document.getElementById("query").value;
  const summaryEl = document.getElementById("summary");
  const tableWrap = document.getElementById("table-wrap");
  const tbody = document.getElementById("result-body");
  const noResult = document.getElementById("no-result");

  summaryEl.style.display = "none";
  tableWrap.style.display = "none";
  noResult.style.display = "block";
  noResult.innerHTML = "Searching...";

  const response = await fetch("/search", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({query})
  });

  const data = await response.json();

  summaryEl.innerHTML = data.summary || "";
  summaryEl.style.display = data.summary ? "block" : "none";
  noResult.style.display = "none";

  tbody.innerHTML = "";
  const results = data.results || [];

  if(results.length > 0){
    tableWrap.style.display = "block";
    const fmt = v => (v !== "" && v !== null && v !== undefined && !isNaN(v))
      ? "₹" + Number(v).toLocaleString("en-IN") : "-";

    results.forEach((c, i) => {
      const followers = c["Followers"] ? Number(c["Followers"]).toLocaleString("en-IN") : "-";
      const rawLink = c["Link"] || "";
      const link = rawLink ? `<a href="${rawLink}" target="_blank" class="btn btn-sm btn-outline-primary">View</a>` : "-";
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${i+1}</td>
        <td><strong>${c["Name"] || "-"}</strong></td>
        <td><span class="badge bg-secondary">${c["Category"] || "-"}</span></td>
        <td>${followers}</td>
        <td>${c["Location"] || "-"}</td>
        <td>${fmt(c["Reel + story reshare"])}</td>
        <td>${fmt(c["Story"])}</td>
        <td>${fmt(c["Static Post"])}</td>
        <td>${fmt(c["UGC (Social media but No Ads)"])}</td>
        <td>${fmt(c["UGC with 1 Month RIghts"])}</td>
        <td>${fmt(c["1 Month Digital RIghts"])}</td>
        <td>${link}</td>
      `;
      tbody.appendChild(row);
    });
  } else {
    noResult.innerHTML = "No creators found for this query.";
    noResult.style.display = "block";
  }
}

</script>

</body>
</html>
